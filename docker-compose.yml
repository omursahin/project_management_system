services:
  db:
    image: postgres:15
    container_name: project_management_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-project_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-project_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-management-backend:latest
    container_name: project_management_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - project-network

volumes:
  db_data:

networks:
  project-network:
    driver: bridge
