name: Django CI & Frontend Check (CI Check)

on: [push]

jobs:
  backend-test:
    name: Run Pytest
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: project_db
      SECRET_KEY: "test-secret-key-for-ci"
      DEBUG: True

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Veritabanı Hazırlıkları (Makemigrations & Migrate)
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Pytest Çalıştır
        run: |
          pytest

  frontend-check:
    name: Run Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Frontend Bağımlılıklarını Yükle
        working-directory: ./frontend # Frontend klasörünün tam adı
        run: npm install

      - name: Frontend Build Çalıştır
        working-directory: ./frontend
        run: |
          CI=false npm run build

      - name: Frontend Testleri Çalıştır
        working-directory: ./frontend
        run: npx vitest run
